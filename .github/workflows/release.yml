name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build extension
        run: npm run build

      - name: Package extension artifact
        run: |
          cd dist
          zip -r ../emotion-context-${{ github.ref_name }}.zip .
          cd ..

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} emotion-context-${{ github.ref_name }}.zip \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
